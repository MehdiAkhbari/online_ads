[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adsim"
version = "0.1.0"
description = "Causal-forest-based simulation of online ad serving (monopoly / duopoly / sample-size scenarios)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Bardiya Akhbari" }]
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.2,<2.3",
    "scipy>=1.11,<2.0",
    "scikit-learn>=1.4,<1.6",
    "econml>=0.15.1,<0.16",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "pyreadstat>=1.2",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "seaborn>=0.13",
    "tqdm>=4.66",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["adsim*"]
exclude = ["scripts*", "notebooks*", "tests*"]
